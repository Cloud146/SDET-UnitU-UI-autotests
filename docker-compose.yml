version: '3'

services:
  selenoid:
    image: aerokube/selenoid:latest-release
    command: -listen :4444 -conf /etc/selenoid/browsers.json -video-output-dir /opt/selenoid/video/ -log-output-dir /opt/selenoid/logs -timeout 3m
    network_mode: bridge
    ports:
      - "4444:4444"
    volumes:
      - ".:/etc/selenoid"
      - "/var/run/docker.sock:/var/run/docker.sock"
  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    network_mode: bridge
    links:
      - selenoid
    ports:
      - "8888:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
  test:
    network_mode: bridge
    image: maven
    volumes:
      - ".:/project"
      - "./m2:/root/.m2"
    working_dir: /project
    command: mvn clean test -P env_docker_selenoid
    links:
      - selenoid
     